name: Verify published studio stability
on:
  push:
    branches: ['codex/studio-public-verification']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.51.1-noble
      options: --shm-size=1gb
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned browser checks
        run: npm install --prefix "$RUNNER_TEMP/studio-qa" --no-audit --no-fund --ignore-scripts playwright@1.51.1
      - name: Check published slow-frame recovery and lightweight mode
        env:
          PAGES_URL: https://dickort.github.io/ti-kst/
        run: NODE_PATH="$RUNNER_TEMP/studio-qa/node_modules" node scripts/qa-studio-stability.cjs
      - name: Save public screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-stability-public
          path: qa-service-navigator/stability-*
          retention-days: 7

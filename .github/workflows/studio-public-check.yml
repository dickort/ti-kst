name: Verify published studio
on:
  push:
    branches: ['codex/studio-public-verification']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.51.1-noble
      options: --shm-size=1gb
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned browser checks
        run: npm install --prefix "$RUNNER_TEMP/studio-qa" --no-audit --no-fund --ignore-scripts playwright@1.51.1
      - name: Verify published demo and existing homepage
        env:
          PAGES_URL: https://dickort.github.io/ti-kst/
        run: node scripts/qa-studio-demo.cjs "$RUNNER_TEMP/studio-qa"
      - name: Save public verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-public-verification
          path: qa-service-navigator/studio-*
          retention-days: 7

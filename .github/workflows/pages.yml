name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply homepage refinements
        run: |
          cat typography-overrides.css >> styles.css
          cat premium-car.css >> styles.css
          cat section-motion.css >> styles.css
          cat amg-v43.css >> styles.css

      - name: Apply AMG v46 scene refinements
        run: python3 patch-amg-v43.py

      - name: Apply final AMG hero polish
        run: python3 patch-final-hero.py

      - name: Assemble verified driver-door model when assets are present
        run: python3 scripts/assemble-driver-door.py

      - name: Validate driver-door controls
        run: |
          node --check --input-type=module < hero-driver-door.js
          node --check --input-type=module < driver-door-controller-v3.js
          node --check --input-type=module < premium-car.js
          node --check --input-type=module < app.js
          npm install --prefix "$RUNNER_TEMP/ti-door-qa" --no-audit --no-fund --ignore-scripts three@0.169.0 jsdom@26.0.0
          node scripts/test-driver-door.mjs "$RUNNER_TEMP/ti-door-qa"

      - name: Inject homepage modules
        run: |
          sed -i 's#<script type="module" src="./app.js"></script>#<script>document.getElementById("stageWrap")?.classList.add("premium-loading");</script>\n  <script src="./navigation-overrides.js"></script>\n  <script type="module" src="./app.js"></script>\n  <script src="./section-motion.js"></script>\n  <script type="module" src="./premium-car.js"></script>#' index.html

      - name: Bust browser cache
        run: |
          VERSION="${GITHUB_SHA}"
          sed -i "s#./styles.css#./styles.css?v=${VERSION}#g" index.html
          sed -i "s#./navigation-overrides.js#./navigation-overrides.js?v=${VERSION}#g" index.html
          sed -i "s#./section-motion.js#./section-motion.js?v=${VERSION}#g" index.html
          sed -i "s#./app.js#./app.js?v=${VERSION}#g" index.html
          sed -i "s#./premium-car.js#./premium-car.js?v=${VERSION}#g" index.html
          sed -i "s#./service-page.css#./service-page.css?v=${VERSION}#g" service.html
          sed -i "s#./service-page.js#./service-page.js?v=${VERSION}#g" service.html
          sed -i "s#./styles.css#./styles.css?v=${VERSION}#g" direction.html
          sed -i "s#./direction-page.css#./direction-page.css?v=${VERSION}#g" direction.html
          sed -i "s#./direction-page.js#./direction-page.js?v=${VERSION}#g" direction.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

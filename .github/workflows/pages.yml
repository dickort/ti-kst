name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply typography refinements
        run: cat typography-overrides.css >> styles.css

      - name: Inject service navigation before module execution
        run: |
          sed -i 's#<script type="module" src="./app.js"></script>#<script src="./navigation-overrides.js"></script>\n  <script type="module" src="./app.js"></script>#' index.html

      - name: Bust browser cache
        run: |
          VERSION="${GITHUB_SHA}"
          sed -i "s#./styles.css#./styles.css?v=${VERSION}#g" index.html
          sed -i "s#./navigation-overrides.js#./navigation-overrides.js?v=${VERSION}#g" index.html
          sed -i "s#./app.js#./app.js?v=${VERSION}#g" index.html
          sed -i "s#./service-page.css#./service-page.css?v=${VERSION}#g" service.html
          sed -i "s#./service-page.js#./service-page.js?v=${VERSION}#g" service.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

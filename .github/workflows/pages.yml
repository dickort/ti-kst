name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main, 'codex/hero-*']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.51.1-noble
      options: --shm-size=1gb
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build service navigation and preserve model quality
        run: |
          python3 scripts/build-service-navigator.py
          python3 scripts/fast-hero.py
      - name: Install pinned rendering and QA dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/ti-nav-deps" --no-audit --no-fund --ignore-scripts three@0.169.0 esbuild@0.25.0 playwright@1.51.1
      - name: Bundle the single hero renderer
        run: |
          NODE_PATH="$RUNNER_TEMP/ti-nav-deps/node_modules" "$RUNNER_TEMP/ti-nav-deps/node_modules/.bin/esbuild" _site/hero-service-navigator.js --bundle --format=esm --target=es2022 --minify --outfile=_site/hero-service-navigator.bundle.js
          node --check --input-type=module < _site/app.js
          node scripts/test-service-navigator.mjs
      - name: Test desktop and mobile navigation
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/ti-nav-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node scripts/qa-site-polish.cjs "$RUNNER_TEMP/ti-nav-deps"
          node scripts/qa-instant-hero.cjs "$RUNNER_TEMP/ti-nav-deps"
          node scripts/qa-service-navigator.cjs "$RUNNER_TEMP/ti-nav-deps"
          node scripts/qa-fast-hero.cjs "$RUNNER_TEMP/ti-nav-deps"
          node scripts/qa-hero-regression.cjs "$RUNNER_TEMP/ti-nav-deps"
      - name: Save interaction checks and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-navigator-qa
          path: qa-service-navigator/
          retention-days: 7
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
